<!DOCTYPE html>
<html lang="en">
<head>

    <title>Support - Elmiasangga Agna</title>
    <style>

            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
            color: #333;
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #0066cc;

        }

            background: #f5f5f5;

        }
        .contact-item {
            margin: 15px 0;
        }
        .label {
            font-weight: bold;
            color: #0066cc;
        }
        a {

            text-decoration: none;
        }
        a:hover {

        }

<body>
    <div class="header">
        <h1>Support Center</h1>
        <p>Elmiasangga Agna</p>
    </div>

    <div class="contact-card">

        <div class="contact-item">
            <span class="label">Support Email:</span><br>
            <a href="mailto:support@elmiasangga-agna.com">support@elmiasangga-agna.com</a>
        </div>

        <div class="contact-item">
            <span class="label">Organization:</span><br>

        </div>

    </div>
